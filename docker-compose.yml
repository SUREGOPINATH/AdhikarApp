version: '3.8'

services:
  app:
    image: gopinath3008/adhikar-app:latest
    container_name: adhikar-app
    ports:
      - "3000:3000"
    volumes:
      - adhikar_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  adhikar_data: